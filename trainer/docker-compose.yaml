# Federated learning simulation: 1 Flower server + 6 building clients,
# plus a Kafka broker that streams new smart-meter readings.
# Run from the trainer/ directory:  docker compose up --build

# Settings shared by all six clients.
x-client: &client
  build:
    context: .
    dockerfile: client/Dockerfile
  depends_on:
    - server
    - kafka
  volumes:
    - ./:/app
  working_dir: /app
  environment:
    - PYTHONPATH=/app

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: fl-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: fl-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  # Publishes one new reading per building to Kafka every 5 minutes.
  producer:
    image: python:3.11-slim
    container_name: fl-producer-rt
    depends_on:
      - kafka
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install -r requirements-producer.txt &&
             python realtime_producer.py"

  # Flower server: FedAvg aggregation, validation and checkpointing.
  # The latest global model is written to the dashboard backend's model folder.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fl-server-rt
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ../app/backend/prediction_model_files_docker:/app/trained_model
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - MODEL_DIR=/app/trained_model
    command: ["python", "server/server.py"]

  # One client per building; each one only reads its own building's data.
  client1:
    <<: *client
    container_name: fl-client1-rt
    command: ["python", "client/client.py", "/app/datasets/future_House1_data.csv", "client1"]

  client2:
    <<: *client
    container_name: fl-client2-rt
    command: ["python", "client/client.py", "/app/datasets/future_House2_data.csv", "client2"]

  client3:
    <<: *client
    container_name: fl-client3-rt
    command: ["python", "client/client.py", "/app/datasets/future_Hospital_data.csv", "client3"]

  client4:
    <<: *client
    container_name: fl-client4-rt
    command: ["python", "client/client.py", "/app/datasets/future_Industry_data.csv", "client4"]

  client5:
    <<: *client
    container_name: fl-client5-rt
    command: ["python", "client/client.py", "/app/datasets/future_Office_data.csv", "client5"]

  client6:
    <<: *client
    container_name: fl-client6-rt
    command: ["python", "client/client.py", "/app/datasets/future_School_data.csv", "client6"]
